<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>HeatSafe - Who are you registering?</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e23235",
                        "background-light": "#f8f6f6",
                        "text": "#2C2A29",
                        "muted": "#8A8683",
                        "surface": "#FFFFFF",
                        "border": "#EAE6E1",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                    },
                    boxShadow: {
                        'soft': '0 8px 30px rgba(44, 42, 41, 0.04)',
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: theme('colors.background-light'); color: theme('colors.text'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">
<header class="w-full max-w-[600px] flex items-center justify-between mb-8">
    <a class="flex items-center text-text hover:text-primary transition-colors" href="../index.html">
        <span class="material-symbols-outlined mr-2">arrow_back</span>
        <span class="font-medium">Back</span>
    </a>
    <div class="flex items-center">
        <img src="../assets/logo.png" alt="HeatSafe Logo" class="h-10 object-contain mix-blend-multiply" />
    </div>
    <div class="w-[72px]"></div>
</header>
<main class="w-full max-w-[600px] bg-surface rounded-xl shadow-soft p-6 sm:p-10">
    <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-text mb-2 tracking-tight">Who are you registering?</h1>
        <p class="text-muted text-base">Select whether you are registering for yourself or someone else.</p>
    </div>
    <div class="space-y-4">
        <a href="form.html" class="block w-full text-left bg-surface border-2 border-border hover:border-primary rounded-xl p-6 transition-all group cursor-pointer">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-bold text-text mb-1 group-hover:text-primary transition-colors">Myself</h3>
                    <p class="text-muted">I want to receive alerts for my own location and conditions.</p>
                </div>
                <span class="material-symbols-outlined text-border group-hover:text-primary transition-colors text-3xl">chevron_right</span>
            </div>
        </a>
        <a href="form.html" class="block w-full text-left bg-surface border-2 border-border hover:border-primary rounded-xl p-6 transition-all group cursor-pointer">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-bold text-text mb-1 group-hover:text-primary transition-colors">Someone Else</h3>
                    <p class="text-muted">I am setting up alerts for a family member or patient.</p>
                </div>
                <span class="material-symbols-outlined text-border group-hover:text-primary transition-colors text-3xl">chevron_right</span>
            </div>
        </a>
    </div>
</main>
</body>
</html>

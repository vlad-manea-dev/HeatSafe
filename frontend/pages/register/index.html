<!-- Onboarding Flow -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HeatSafe - Register Vulnerable Person</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e23235",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211112",
                        "text": "#2C2A29",
                        "muted": "#8A8683",
                        "surface": "#FFFFFF",
                        "border": "#EAE6E1",
                        "risk-amber": "#E76F51",
                        "safe-sage": "#4A7C59",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 8px 30px rgba(44, 42, 41, 0.04)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.background-light');
            color: theme('colors.text');
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="min-h-screen bg-background-light flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">
<header class="w-full max-w-[600px] flex items-center justify-between mb-8">
<a class="flex items-center text-text hover:text-primary transition-colors" href="../index.html">
<span class="material-symbols-outlined mr-2">arrow_back</span>
<span class="font-medium">Back</span>
</a>
<div class="flex items-center gap-2">
<div class="size-6 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_535)">
<path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
</g>
<defs>
<clippath id="clip0_6_535"><rect fill="white" height="48" width="48"></rect></clippath>
</defs>
</svg>
</div>
<span class="font-bold text-xl tracking-tight">HeatSafe</span>
</div>
<div class="w-[72px]"></div>
</header>
<main class="w-full max-w-[600px] bg-surface rounded-xl shadow-soft p-6 sm:p-10">
<div class="mb-8">
<div class="flex justify-between text-sm font-medium text-muted mb-2">
<span>Step 1 of 4</span>
<span>About</span>
</div>
<div class="w-full bg-border rounded-full h-2">
<div class="bg-primary h-2 rounded-full transition-all duration-300" style="width: 25%"></div>
</div>
</div>
<div class="mb-8">
<h1 class="text-3xl font-bold text-text mb-2 tracking-tight">Who are you registering?</h1>
<p class="text-muted text-base">Please provide basic details about the person at risk.</p>
</div>
<form class="space-y-6">
<div>
<label class="block text-base font-medium text-text mb-2" for="fullName">Full Name</label>
<input class="w-full px-4 py-3 rounded-lg border border-border text-[18px] focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-muted/60" id="fullName" name="fullName" placeholder="e.g. Mary Smith" type="text"/>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<div>
<label class="block text-base font-medium text-text mb-2" for="age">Age</label>
<input class="w-full px-4 py-3 rounded-lg border border-border text-[18px] focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-muted/60" id="age" name="age" placeholder="e.g. 78" type="number"/>
</div>
<div>
<label class="block text-base font-medium text-text mb-2" for="eircode">Eircode</label>
<input class="w-full px-4 py-3 rounded-lg border border-border text-[18px] focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-muted/60 uppercase" id="eircode" name="eircode" placeholder="e.g. D01 AB12" type="text"/>
<p class="text-xs text-muted mt-1">Used to calculate local heat offset.</p>
</div>
</div>
<div class="pt-6 flex justify-end">
<a href="../dashboard/index.html" class="bg-primary text-white font-medium text-[18px] py-3 px-8 rounded-lg hover:bg-primary/90 transition-colors focus:ring-4 focus:ring-primary/20 flex items-center gap-2">
                    Next Step
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</a>
</div>
</form>
</main>
</body></html>

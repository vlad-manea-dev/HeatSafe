<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Outfit:wght@400;500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e23235",
                        "background-light": "#FDFBF7",
                        "surface": "#FFFFFF",
                        "text-main": "#2C2A29",
                        "muted": "#8A8683",
                        "border-subtle": "#EAE6E1",
                        "risk-amber": "#E76F51",
                        "safe-sage": "#4A7C59",
                    },
                    fontFamily: {
                        "display": ["Fraunces", "serif"],
                        "body": ["Outfit", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "16px", "xl": "1.5rem", "full": "9999px"},
                    boxShadow: {
                        'soft': '0 8px 30px rgba(44, 42, 41, 0.04)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: theme('colors.background-light');
            color: theme('colors.text-main');
        }
        h1, h2, h3, h4, h5, h6, .font-display {
            font-family: 'Fraunces', serif;
        }
    </style>
</head>
<body class="min-h-screen bg-background-light text-text-main flex flex-col items-center">
<div class="relative flex h-auto w-full flex-col bg-surface group/design-root overflow-x-hidden shadow-sm">
<div class="layout-container flex h-full grow flex-col w-full">
<div class="px-4 md:px-10 lg:px-40 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col w-full max-w-[1200px] flex-1">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-border-subtle px-4 md:px-10 py-3">
<div class="flex items-center gap-4 text-text-main">
<div class="size-6 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_535)">
<path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
</g>
<defs>
<clippath id="clip0_6_535"><rect fill="white" height="48" width="48"></rect></clippath>
</defs>
</svg>
</div>
<a href="../index.html"><h2 class="text-text-main text-xl font-display font-semibold leading-tight tracking-[-0.015em]">HeatSafe</h2></a>
</div>
<div class="flex flex-1 justify-end items-center gap-8">
<div class="hidden md:flex items-center gap-9">
<a class="text-primary text-sm font-medium leading-normal border-b-2 border-primary pb-1" href="index.html">Dashboard</a>
<a class="text-muted hover:text-text-main transition-colors text-sm font-medium leading-normal" href="../city/index.html">Map View</a>
<a class="text-muted hover:text-text-main transition-colors text-sm font-medium leading-normal flex items-center gap-1" href="../enterprise/index.html"><span class="material-symbols-outlined text-[18px]">domain</span> Enterprise</a>
</div>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 border border-border-subtle" data-alt="close-up portrait of an older woman with short grey hair smiling gently, soft natural lighting" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBo8FLKJIqTNmGlDSSTugACZrchw1SDJFZ8fpCzk0_8Pf3i7dIXnbrfgP_jl_NRqZmD8E7QK5N8KeCEjwsD-97wYWo7cnt2ZkhdsHrRFcX3vxvIgtVjIiDVGM945IobCym52kwylxzbAYB836Jbv-6a-xHnO2z3rcAxz7gqRs8pIWE51qIZ89GbvQTd8SVIKJYsPt28xiPcgyZ96v4Nwv7ipNY90edzSWiJZfrIhu_j9wNC5glN6Dyd7vQEymIqiPPICRYhweStbTs");'></div>
</div>
</header>
<div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 p-4 md:px-10 mt-6">
<div class="flex min-w-72 flex-col gap-2">
<h1 class="text-text-main font-display text-4xl font-semibold leading-tight" id="monitoring-title">Monitoring -- people.</h1>
<p class="text-muted text-lg font-normal leading-normal">Current Dublin baseline: <span class="font-medium text-text-main" id="dash-temp">--°C</span></p>
</div>
<div class="flex">
<div class="flex h-12 flex-1 items-center justify-center rounded-lg bg-background-light border border-border-subtle p-1 shadow-inner">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-4 has-[:checked]:bg-surface has-[:checked]:shadow-soft has-[:checked]:text-primary has-[:checked]:font-medium text-muted text-base transition-all">
<span class="truncate">Risk Level</span>
<input checked="" class="invisible w-0" name="sort-order" type="radio" value="Risk Level"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-4 has-[:checked]:bg-surface has-[:checked]:shadow-soft has-[:checked]:text-primary has-[:checked]:font-medium text-muted text-base transition-all">
<span class="truncate">Name</span>
<input class="invisible w-0" name="sort-order" type="radio" value="Name"/>
</label>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
<main class="w-full max-w-[1200px] mx-auto px-4 md:px-10 lg:px-40 py-8 flex-grow">
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="people-grid">
<div class="col-span-full text-center py-12 text-muted">Loading...</div>
</div>
</main>
<script>
const API = 'http://localhost:3000';

function getRiskColor(score) {
  if (score >= 70) return { bg: 'bg-primary', border: 'hover:border-primary', ring: 'focus:ring-primary', icon: 'warning', iconStyle: "font-variation-settings: 'FILL' 1;", textColor: 'text-primary' };
  if (score >= 40) return { bg: 'bg-risk-amber', border: 'hover:border-risk-amber', ring: 'focus:ring-risk-amber', icon: 'thermostat', iconStyle: '', textColor: 'text-risk-amber' };
  return { bg: 'bg-safe-sage', border: 'hover:border-safe-sage', ring: 'focus:ring-safe-sage', icon: 'check_circle', iconStyle: '', textColor: 'text-safe-sage' };
}

function getRiskMessage(person) {
  if (person.score >= 70) {
    const meds = person.breakdown.medications;
    if (meds.length > 0) return `Medication alert: ${meds.map(m => m.drug_class).join(', ')} increase heat risk.`;
    return 'High risk alert active. Check in regularly.';
  }
  if (person.score >= 40) {
    if (person.breakdown.top_floor) return 'Top floor apartment. Ensure fans are running this afternoon.';
    return 'Moderate risk. Stay hydrated and avoid peak heat.';
  }
  return 'Current conditions are safe. No action needed.';
}

fetch(API + '/api/people')
  .then(r => r.json())
  .then(data => {
    document.getElementById('dash-temp').textContent = Math.round(data.currentTemp) + '°C';
    document.getElementById('monitoring-title').textContent = `Monitoring ${data.people.length} people.`;

    const grid = document.getElementById('people-grid');
    let html = '';

    data.people.forEach(p => {
      const c = getRiskColor(p.score);
      const msg = getRiskMessage(p);
      const textClass = p.score >= 70 ? 'text-text-main' : (p.score >= 40 ? 'text-text-main' : 'text-muted');
      html += `
        <a class="group block bg-surface rounded-lg p-6 shadow-soft border border-transparent ${c.border} hover:-translate-y-1 transition-all duration-300 relative overflow-hidden focus:outline-none focus:ring-2 ${c.ring} focus:ring-offset-2" href="detail/index.html?id=${p.id}">
          <div class="flex justify-between items-start mb-4">
            <div>
              <h3 class="text-2xl font-display text-text-main font-semibold mb-1">${p.name}</h3>
              <p class="text-muted text-base flex items-center gap-1">
                <span class="material-symbols-outlined text-[18px]">location_on</span>
                ${p.address}
              </p>
            </div>
            <div class="flex flex-col items-center justify-center size-14 rounded-full ${c.bg} text-white shadow-md">
              <span class="text-xl font-bold leading-none">${p.score}</span>
            </div>
          </div>
          <div class="mt-6 pt-4 border-t border-border-subtle">
            <p class="text-sm ${textClass} flex items-start gap-2">
              <span class="material-symbols-outlined ${c.textColor} text-[20px] mt-0.5" style="${c.iconStyle}">${c.icon}</span>
              <span class="flex-1">${msg}</span>
            </p>
          </div>
          <div class="absolute inset-x-0 bottom-0 h-1 ${c.bg}"></div>
        </a>`;
    });

    html += `
      <a href="../register/index.html" class="group flex flex-col items-center justify-center h-full min-h-[220px] bg-transparent rounded-lg p-6 border-2 border-dashed border-border-subtle hover:border-primary hover:bg-white transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
        <div class="size-12 rounded-full bg-background-light flex items-center justify-center text-primary mb-4 group-hover:scale-110 transition-transform">
          <span class="material-symbols-outlined text-3xl">add</span>
        </div>
        <span class="text-lg font-medium text-text-main group-hover:text-primary transition-colors">Register another person</span>
      </a>`;

    grid.innerHTML = html;
  })
  .catch(() => {
    document.getElementById('people-grid').innerHTML = '<div class="col-span-full text-center py-12 text-primary">Failed to load data. Is the backend running?</div>';
  });
</script>
</body></html>
